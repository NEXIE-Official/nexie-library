name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Add Maven Central mirror for Android dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("android/settings.gradle", "android/build.gradle"):
              path = Path(name)
              if path.exists():
                  source = path.read_text()
                  source = source.replace(
                      "mavenCentral()",
                      "maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }\\n            mavenCentral()"
                  )
                  path.write_text(source)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nexie-library-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
